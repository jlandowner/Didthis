# PostgreSQL credentials.
# IMPORTANT: Replace ALL values below with your own secure values before deploying.
# Never use the placeholder values in production.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: didthis
type: Opaque
stringData:
  POSTGRES_USER: devuser
  POSTGRES_PASSWORD: changeme
  POSTGRES_DB: didthis
