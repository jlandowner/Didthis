# Exporter job credentials.
# Replace ALL placeholder values before applying to your cluster.
apiVersion: v1
kind: Secret
metadata:
  name: exporter-secret
  namespace: didthis
type: Opaque
stringData:
  # Must match the value set in appserver-secret
  EXPORTER_GRAPHQL_ACCESS_TOKEN: ""
  # Optional: Cloudinary credentials for image export (base64-encoded JSON)
  CLOUDINARY_JSON_SECRET_B64: ""
