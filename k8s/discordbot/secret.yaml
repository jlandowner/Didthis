# Discord bot credentials.
# Replace ALL placeholder values before applying to your cluster.
apiVersion: v1
kind: Secret
metadata:
  name: discordbot-secret
  namespace: didthis
type: Opaque
stringData:
  DISCORD_CLIENT_ID: ""
  DISCORD_CLIENT_SECRET: ""
  DISCORD_SERVER_ID: ""
  DISCORD_CHANNEL_ID: ""
  DISCORD_BOT_TOKEN: ""
  # Must match the value set in appserver-secret
  DISCORD_BOT_GRAPHQL_ACCESS_TOKEN: ""
  DISCORD_BOT_PUBLIC_UPDATES_POLL_PERIOD: "5000"
  DISCORD_BOT_PUBLIC_UPDATES_POST_CATCHUP: "300000"
  DISCORD_BOT_PUBLIC_UPDATES_POST_DELAY: "45000"
