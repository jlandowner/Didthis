apiVersion: apps/v1
kind: Deployment
metadata:
  name: appserver
  namespace: didthis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: appserver
  template:
    metadata:
      labels:
        app: appserver
    spec:
      initContainers:
        # Run database migrations before the app starts
        - name: migrate
          image: didthis/appserver:latest
          command: ["npx", "knex", "migrate:latest"]
          envFrom:
            - configMapRef:
                name: appserver-config
            - secretRef:
                name: appserver-secret
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /secrets/firebase-credentials.json
          volumeMounts:
            - name: firebase-credentials
              mountPath: /secrets
              readOnly: true
      containers:
        - name: appserver
          image: didthis/appserver:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: appserver-config
            - secretRef:
                name: appserver-secret
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /secrets/firebase-credentials.json
          volumeMounts:
            - name: firebase-credentials
              mountPath: /secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: firebase-credentials
          secret:
            secretName: appserver-secret
            items:
              - key: firebase-credentials.json
                path: firebase-credentials.json
