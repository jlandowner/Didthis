apiVersion: v1
kind: ConfigMap
metadata:
  name: appserver-config
  namespace: didthis
data:
  APP_NAME: "didthis"
  ENV_NAME: "prod"
  NEXT_PUBLIC_ENV_NAME: "prod"
  FLAG_USE_DB: "true"
  PORT: "3000"
  NODE_ENV: "production"
  NEXT_TELEMETRY_DISABLED: "1"
  # Set this to your public domain, e.g. https://didthis.example.com
  NEXT_PUBLIC_API_ENDPOINT: "https://didthis.example.com"
  # Optional: Discord bot integration
  DISCORD_BOT_PUBLIC_UPDATES_POST_DELAY: "45000"
