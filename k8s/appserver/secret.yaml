# Sensitive configuration for the app server.
# Replace ALL placeholder values before applying to your cluster.
#
# Firebase credentials JSON file contents:
#   Paste the full contents of your Firebase service account JSON file as the
#   value of 'firebase-credentials.json' below.  The file is mounted into the
#   container at /secrets/firebase-credentials.json and pointed to by
#   GOOGLE_APPLICATION_CREDENTIALS.
#   Generate the key in the Firebase console →
#     Project settings → Service accounts → Generate new private key.
apiVersion: v1
kind: Secret
metadata:
  name: appserver-secret
  namespace: didthis
type: Opaque
stringData:
  # PostgreSQL connection string.
  # IMPORTANT: Must exactly match the POSTGRES_USER, POSTGRES_PASSWORD, and POSTGRES_DB
  # values set in postgres/secret.yaml. Do not deploy with the placeholder values.
  DATABASE_URL: "postgresql://devuser:changeme@postgres:5432/didthis"

  # Random secret used to sign session cookies.
  # IMPORTANT: Generate a unique value before deploying:
  #   openssl rand -hex 32
  # Using this placeholder in production is a critical security vulnerability.
  SESSION_COOKIE_SECRET: "changeme-generate-with-openssl-rand-hex-32"

  # Firebase service account JSON file contents (paste the full JSON here)
  firebase-credentials.json: |
    {}

  # Amplitude analytics API key (optional)
  NEXT_PUBLIC_AMPLITUDE_API_KEY: ""

  # Cloudinary image hosting credentials, base64-encoded JSON (optional)
  CLOUDINARY_JSON_SECRET_B64: ""

  # Zyte Splash link-preview service username (optional)
  ZYTE_SPLASH_USERNAME: ""

  # Discord OAuth app credentials (optional — required for Discord login)
  DISCORD_CLIENT_ID: ""
  DISCORD_CLIENT_SECRET: ""

  # Shared token used to authenticate requests from the Discord bot (optional)
  DISCORD_BOT_GRAPHQL_ACCESS_TOKEN: ""

  # Shared token used to authenticate requests from the exporter job (optional)
  EXPORTER_GRAPHQL_ACCESS_TOKEN: ""
